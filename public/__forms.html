<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Forms</title></head>
<body>
<!--
  Netlify Forms detection file (required for Next.js on Netlify).
  Every field the site posts must be declared here. Do not delete.
-->
<form name="newsletter" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="newsletter"><input name="bot-field"><input name="email">
</form>
<form name="discovery-call" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="discovery-call"><input name="bot-field">
  <input name="request-type"><input name="name"><input name="phone"><input name="email"><input name="duration"><input name="best-time"><input name="format"><textarea name="message"></textarea><input name="consent"><input name="scalp-check-profile">
</form>
<form name="speaking-inquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="speaking-inquiry"><input name="bot-field">
  <input name="name"><input name="role"><input name="organization"><input name="email"><input name="phone"><input name="event-date"><input name="audience-type"><input name="audience-size"><input name="format"><input name="location"><input name="talk"><input name="budget"><input name="referral"><textarea name="message"></textarea><input name="consent">
</form>
<form name="class-waitlist" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="class-waitlist"><input name="bot-field">
  <input name="name"><input name="email"><input name="salon"><input name="class"><input name="role">
</form>
<form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="contact"><input name="bot-field">
  <input name="name"><input name="email"><input name="phone"><input name="topic"><textarea name="message"></textarea>
</form>
<form name="scalp-check" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="scalp-check"><input name="bot-field">
  <input name="name"><input name="email"><input name="profile"><input name="refer-flag">
  <input name="q-who"><input name="q-shedding"><input name="q-where"><input name="q-styles"><input name="q-scalp"><input name="q-wash"><input name="q-inside">
</form>
</body>
</html>
